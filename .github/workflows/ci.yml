name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '22'
          - '24'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Dogfood
        run: npm run dogfood

      - name: Build
        run: npm run build

      - name: Pack and smoke test the published tarball
        if: matrix.node == '24'
        run: |
          npm pack --silent
          tar -xzf envgle-*.tgz
          node package/dist/src/cli.js --version
          node package/dist/src/cli.js --help > /dev/null
          rm -rf package envgle-*.tgz
