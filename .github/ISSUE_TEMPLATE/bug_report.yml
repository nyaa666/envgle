name: Bug report
description: Something in envgle behaves incorrectly, crashes, or reports a finding you believe is wrong.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Never paste a real secret into this issue. Replace every value with a
        placeholder such as `your-api-key-here`, and describe the shape of a
        credential in words if the shape is the point (`ghp_` followed by 36
        characters). Reports that contain a working credential cannot be
        deleted once they are public, and the fix is to rotate it.

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: envgle 0.1.0
      description: Output of `envgle --version`.
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: v22.14.0
      description: Output of `node --version`.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, or Windows 11
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran, including every flag.
      placeholder: envgle scan . --format json
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What envgle did, and what you expected it to do instead.
    validations:
      required: true

  - type: textarea
    id: json-output
    attributes:
      label: Output
      description: |
        Paste the output of the same command with `--format json` added. This
        is the most useful single piece of information in the report: it
        contains the rule id, the resolved severity, the exact file, line and
        column, and the resolved configuration.
      render: |
        ```json
        {
          "tool": { "name": "envgle", "version": "0.1.0" },
          "summary": {
            "error": 1, "warn": 0, "info": 0, "total": 1,
            "byRule": { "missing-in-env": 1 }
          },
          "findings": [
            {
              "ruleId": "missing-in-env",
              "ruleTitle": "Variable read but never declared",
              "severity": "error",
              "message": "MY_TOKEN is read in src/server.ts but never declared in any env file",
              "file": "src/server.ts",
              "line": 14,
              "column": 22,
              "variable": "MY_TOKEN"
            }
          ]
        }
        ```
      description_detail: |
        Values are never printed by envgle, so this output is safe to paste
        once you have checked it. If a value does appear anywhere, that is the
        bug: say so in "What happened" and do not paste that line.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        The smallest repository that shows the problem. A directory tree plus
        the contents of the few files that matter is best; a script that builds
        one is also fine. Please redact values.
      render: |
        ```
        repro/
          .env
          package.json
          src/server.ts
        ```
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: |
        The contents of your `.envglerc.json`, the `envgle` key in
        `package.json`, or `--config` file, if you use one. Write "none" if you
        rely on the defaults.
      render: json
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Additional output
      description: |
        Verbose output or stderr, if you have it. `--verbose` usually contains
        the resolved configuration source and the per-file scan decisions.
      render: text
    validations:
      required: false
